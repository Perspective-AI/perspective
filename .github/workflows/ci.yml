name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: type-aware lint rules read @perspective-ai/sdk's types
      # from its dist/, and the later steps reuse the cached build.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint:check

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test SSR
        run: pnpm test:ssr

      - name: Test types
        run: pnpm test:types

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 15
    # Browsers + system deps are pre-baked into this image, so there is no
    # `playwright install` download step (it deterministically stalled on the CDN).
    # Keep the tag in sync with the @playwright/test version in the root package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    # GitHub overrides HOME to /github/home in container jobs, so Playwright looks
    # for browsers in the default ~/.cache path instead of where the image bakes
    # them. Point it at the image's location — and note the `test:e2e` task in
    # packages/sdk/vite.config.ts must list this var in `cache.untrackedEnv`, or
    # Vite Task's clean environment strips it from `playwright test`.
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # This job never commits, so skip installing the Vite+ git hooks from the
      # `vp config` postinstall (the container's workspace is also owned by a
      # different UID, which git's dubious-ownership guard rejects).
      VP_GIT_HOOKS: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/sdk/playwright-report/
          retention-days: 30
