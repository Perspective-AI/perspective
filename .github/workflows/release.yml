name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: package.json
          cache: true
          registry-url: https://registry.npmjs.org
          run-install: |
            args: ["--frozen-lockfile"]

      # No Vite Task cache restore here: published files always come from a
      # fresh build.
      - name: Build
        run: vp run build

      # Keep these as pnpm scripts, not `vp run`: Vite Task runs tasks in a
      # filtered environment, which would hide NODE_AUTH_TOKEN and
      # GITHUB_TOKEN from `changeset publish`.
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm run version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
